<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PM2.5 widget — bottom controls layout</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#fafafa}
  .frame{max-width:1200px;margin:18px auto;padding:0;border:1px solid #ddd;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
  .header{padding:10px 14px;background:#fff;border-bottom:1px solid #eee}
  .header h3{margin:0;font-size:16px}
  .content{display:flex;flex-direction:column;gap:12px}
  #map { width: 100%; height: 620px; }
  .bottom-controls{display:flex;flex-wrap:wrap;gap:12px;padding:12px;background:#fff;border-top:1px solid #eee}
  .control { flex:1 1 220px; min-width:220px }
  label{display:block;font-weight:600;margin-bottom:6px}
  .small{font-size:13px;color:#555}
  .legend-box{background:#fff;border:1px solid #eee;padding:8px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,0.03)}
  .legend-box img{width:100%;height:auto;display:block}
  .legend-caption{font-size:13px;color:#333;margin-top:6px;text-align:center}
</style>
</head>
<body>

<div class="frame">
  <div class="header">
    <h3>PM2.5 (ECMWF) — Thầy Tùng HANU</h3>
  </div>

  <div class="content">
    <div id="map"></div>

    <div class="bottom-controls">
      <div class="control">
        <label>Legend</label>
        <div class="legend-box">
          <img id="legendImg" alt="Legend for PM2.5" crossorigin="anonymous"
               src="http://eccharts.ecmwf.int/wms/?token=public&SERVICE=WMS&REQUEST=GetLegendGraphic&VERSION=1.3.0&LAYER=composition_pm2p5&STYLE=sh_all_pm2p5_defra_daqi&FORMAT=image/png">
          <div class="legend-caption">Range: 0.01 — 10</div>
        </div>
      </div>

      <div class="control">
        <label>Opacity</label>
        <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.5" style="width:100%">
        <div class="small">Giá trị hiện tại: <span id="opacityVal">0.50</span></div>
      </div>

      <div class="control">
        <label>Chọn ngày / giờ</label>
        <input id="date" type="date" style="width:100%;padding:6px;font-size:14px">
        <select id="hour" style="width:100%;padding:6px;margin-top:6px;font-size:14px"></select>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="apply" style="flex:1;padding:8px">Áp dụng</button>
          <button id="latest" style="flex:1;padding:8px">Gần nhất</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ======== HÀM LẤY TIME DIMENSION MỚI NHẤT TỪ WMS =========
function fetchTimeDimension() {
  const url = 'http://eccharts.ecmwf.int/wms/?token=public&service=WMS&version=1.3.0&request=GetCapabilities';
  return fetch(url)
    .then(r => r.text())
    .then(txt => {
      const parser = new DOMParser();
      const xml = parser.parseFromString(txt, "application/xml");
      const dimEl = xml.querySelector('Dimension[name="time"]');
      if (dimEl) {
        return dimEl.textContent.trim();
      }
      throw new Error("Không tìm thấy Dimension time");
    });
}

// ======== HÀM MỞ RỘNG TIME DIM STRING THÀNH DANH SÁCH ISO =========
function expandTimeDim(text){
  if(!text) return [];
  var parts = text.split(','), out=[];
  for(var i=0;i<parts.length;i++){
    var p = parts[i].trim();
    if(p.indexOf('/')!=-1){
      var seg = p.split('/');
      if(seg.length>=3){
        var start=new Date(seg[0]), end=new Date(seg[1]), interval=seg[2];
        var stepMs=0;
        if(interval.startsWith('PT') && interval.endsWith('H')) stepMs = parseInt(interval.replace('PT','').replace('H',''))*3600*1000;
        else if(interval.startsWith('P') && interval.endsWith('D')) stepMs = parseInt(interval.replace('P','').replace('D',''))*24*3600*1000;
        for(var t=start.getTime(); t<=end.getTime(); t+=stepMs) out.push(new Date(t).toISOString());
      }
    } else { if(p) out.push(new Date(p).toISOString()); }
  }
  return Array.from(new Set(out)).sort();
}

// ======== HÀM ĐẶT MẶC ĐỊNH NGÀY GIỜ THEO GIỜ HÀ NỘI =========
function setDefaultHanoiTime() {
  const now = new Date();
  const hanoiOffsetMs = 7 * 60 * 60 * 1000;
  const utcMs = now.getTime() + (now.getTimezoneOffset() * 60 * 1000);
  const hanoiTime = new Date(utcMs + hanoiOffsetMs);

  const dateEl = document.getElementById('date');
  const hourEl = document.getElementById('hour');

  dateEl.value = hanoiTime.toISOString().slice(0, 10);

  const hh = String(hanoiTime.getHours()).padStart(2, '0') + ':00:00Z';
  for (let i = 0; i < hourEl.options.length; i++) {
    if (hourEl.options[i].value === hh) {
      hourEl.selectedIndex = i;
      break;
    }
  }
}

// ======== MAP SETUP =========
var map = L.map('map', {crs: L.CRS.EPSG3857}).setView([21,105],7);
L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {maxZoom:20, attribution:'© Google'}).addTo(map);

var wms = L.tileLayer.wms('http://eccharts.ecmwf.int/wms/', {
  token: 'public',
  version: '1.3.0',
  layers: 'composition_pm2p5',
  styles: 'sh_all_pm2p5_defra_daqi',
  format: 'image/png',
  transparent: true,
  crs: L.CRS.EPSG4326
}).setOpacity(0.5).addTo(map);

var times = [];
var hourEl = document.getElementById('hour');

// ======== LẤY TIME DIMENSION TỪ SERVER & KHỞI TẠO =========
fetchTimeDimension().then(dimStr => {
  var timeDimString = dimStr;
  times = expandTimeDim(timeDimString);

  // Xác định bước giờ
  var detectedStep = 3;
  var m = timeDimString.match(/PT(\d+)H/); if(m) detectedStep = parseInt(m[1]);

  // Populate giờ
  hourEl.innerHTML = '';
  for(var h=0; h<24; h+=detectedStep){
    var val = String(h).padStart(2,'0') + ':00:00Z';
    var opt = document.createElement('option'); 
    opt.value = val; 
    opt.text = String(h).padStart(2,'0') + ':00'; 
    hourEl.appendChild(opt);
  }

  // Đặt min, max cho input date
  if(times.length>0){
    var first = new Date(times[0]), last = new Date(times[times.length-1]);
    var dateEl = document.getElementById('date');
    dateEl.min = first.toISOString().slice(0,10); 
    dateEl.max = last.toISOString().slice(0,10);
  }

  // Đặt giờ mặc định là giờ Hà Nội
  setDefaultHanoiTime();
});

// ======== OPACITY CONTROL =========
var opEl = document.getElementById('opacity'), opVal = document.getElementById('opacityVal');
opEl.addEventListener('input', function(){ 
  wms.setOpacity(opEl.value); 
  opVal.textContent = parseFloat(opEl.value).toFixed(2); 
});

// ======== NÚT ÁP DỤNG THỜI GIAN =========
document.getElementById('apply').addEventListener('click', function(){
  var d = document.getElementById('date').value;
  var h = document.getElementById('hour').value;
  if(!d) return alert('Chọn ngày trước');
  var iso = d + 'T' + h;
  if(times.length>0){
    var tgt = new Date(iso).getTime(), best=Infinity, idx=0;
    for(var i=0;i<times.length;i++){ 
      var diff = Math.abs(new Date(times[i]).getTime()-tgt); 
      if(diff<best){best=diff; idx=i;} 
    }
    iso = times[idx];
  }
  wms.setParams({time: iso});
});

// ======== NÚT LẤY GIỜ MỚI NHẤT =========
document.getElementById('latest').addEventListener('click', function(){
  if(times.length>0){
    var latest = times[times.length-1];
    document.getElementById('date').value = latest.slice(0,10);
    var hh = latest.slice(11);
    for(var i=0;i<hourEl.options.length;i++) 
      if(hourEl.options[i].value===hh) hourEl.selectedIndex=i;
    wms.setParams({time: latest});
  }
});

// ======== LEGEND FALLBACK =========
var INLINE_LEGEND_CONFIG = {
  colors: ["#00FF00","#80FF00","#FFFF00","#FFD700","#FFA500","#FF9999","#FF0000","#800000","#CC00FF"],
  labels: ["12","24","36","42","48","54","59","65","71"],
  title: "Contour shade DEFRA PM2.5 DAQI",
  subtitle: "Range: 0.01 — 10"
};
function makeInlineLegendSVG(cfg, widthPx){
  widthPx = widthPx || 260;
  var cols = cfg.colors.length;
  var boxW = Math.floor((widthPx - 20) / cols);
  var height = 80;
  var svgParts = [];
  svgParts.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+widthPx+'" height="'+height+'">');
  svgParts.push('<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}</style>');
  svgParts.push('<text x="10" y="14" font-size="12" font-weight="700">'+cfg.title+'</text>');
  svgParts.push('<text x="10" y="30" font-size="11" fill="#444">'+cfg.subtitle+'</text>');
  var startX = 10, startY = 40;
  for(var i=0;i<cols;i++){
    var x = startX + i*boxW;
    svgParts.push('<rect x="'+x+'" y="'+startY+'" width="'+(boxW-1)+'" height="14" fill="'+cfg.colors[i]+'" stroke="rgba(0,0,0,0.06)"/>');
  }
  var labelY = startY + 32;
  for(var i=0;i<cols;i++){
    var x = startX + i*boxW + (boxW/2);
    var txt = cfg.labels[i] || '';
    svgParts.push('<text x="'+x+'" y="'+labelY+'" font-size="11" text-anchor="middle" fill="#333">'+txt+'</text>');
  }
  svgParts.push('</svg>');
  return svgParts.join('');
}
var legendImg = document.getElementById('legendImg');
legendImg.onerror = function(){
  var svg = makeInlineLegendSVG(INLINE_LEGEND_CONFIG, 220);
  legendImg.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
};
legendImg.onload = function(){
  setTimeout(function(){
    if(legendImg.naturalWidth === 0 || legendImg.naturalHeight === 0){ legendImg.onerror(); }
  }, 300);
};
</script>
</body>
</html>
